[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "featbench"
version = "0.1.0"
description = "Build custom benchmarks for coding agents from your own repositories: business rules, architecture fitness functions and performance."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
featbench = "featbench.cli:main"

[tool.setuptools.packages.find]
include = ["featbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
